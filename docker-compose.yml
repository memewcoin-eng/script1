version: '3.8'

services:
  remote-camera:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HTTPS=false
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - camera-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - remote-camera
    restart: unless-stopped
    networks:
      - camera-network

networks:
  camera-network:
    driver: bridge

volumes:
  logs:
